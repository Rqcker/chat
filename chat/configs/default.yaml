# Default configuration for the CHAT pipeline.
# Copy and edit, then load with Config.load("my_config.yaml").
# Secrets are NOT stored here: set the API key via the environment variable named
# by llm.api_key_env (default GEMINI_API_KEY).

paths:
  output_dir: ./outputs
  temp_dir: ./temp

llm:
  provider: gemini
  api_key_env: GEMINI_API_KEY
  endpoint: https://generativelanguage.googleapis.com/v1beta/models
  timeout: 120

tdg:
  model: gemini-2.5-flash
  temperature: 0.7
  max_output_tokens: 4096
  num_scripts: 1
  total_turns: 8          # turns per conversation (paper: 5-10)
  segment_min_turns: 5
  segment_max_turns: 10
  max_retries: 2

iar:
  model: gemini-2.5-flash
  temperature: 0.3
  max_output_tokens: 4096
  p_inter: 0.3
  iw_duration: 0.5
  seed: 0
  max_retries: 2
  backchannel_reactivity: 0.5
